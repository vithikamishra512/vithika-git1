```
<div class="container">

    <h1>✨ LifeFix AI</h1>

    <p class="subtitle">
        Your AI-powered daily life problem solver
    </p>

    <div class="card">

        <h2>What's troubling you?</h2>

        <textarea
            id="problem"
            placeholder="Example: I have too many tasks and don't know how to manage my day..."
        ></textarea>

        <br>

        <button onclick="solveProblem()">
            Solve My Problem 🤖
        </button>

        <div id="response"></div>

    </div>

</div>

<script>
    async function solveProblem() {

        const problem = document.getElementById("problem").value;
        const response = document.getElementById("response");

        if (!problem.trim()) {
            response.innerText = "Please describe your problem first.";
            return;
        }

        response.innerText = "Thinking... 🤔";

        try {

            const result = await fetch("http://127.0.0.1:8000/solve", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: problem
                })
            });

            const data = await result.json();

            response.innerText = data.solution;

        } catch (error) {

            response.innerText =
                "Something went wrong. Please make sure the LifeFix backend is running.";

        }
    }
</script>
